<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#142943" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Portal de Disciplinas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div class="institution-row">
        <img class="institution-logo" id="institution-logo" src="" alt="" />
        <div class="institution-text">
          <p class="institution-name" id="institution-nome"></p>
          <p class="course-name" id="institution-curso"></p>
        </div>
      </div>
      <h1>Portal de Disciplinas</h1>
      <div class="status-row">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="mono-tag" id="status-semestre"></span>
      </div>
    </div>
  </header>

  <main>
    <p class="section-lead">Escolha uma disciplina para ver as aulas e baixar o material.</p>
    <div class="cards" id="cards"></div>
  </main>

  <footer id="footer"></footer>

  <script src="data.js"></script>
  <script>
    document.getElementById("institution-logo").src = INSTITUICAO.logo;
    document.getElementById("institution-logo").alt = INSTITUICAO.sigla;
    document.getElementById("institution-nome").textContent = `${INSTITUICAO.nome} · ${INSTITUICAO.sigla}`;
    document.getElementById("institution-curso").textContent = INSTITUICAO.curso;
    document.getElementById("status-semestre").textContent = "Semestre 2026.2 · Em andamento";
    document.getElementById("footer").textContent = `${INSTITUICAO.nome} (${INSTITUICAO.sigla}) · ${INSTITUICAO.curso} · Semestre 2026.2`;

    const container = document.getElementById("cards");

    Object.keys(DISCIPLINAS).forEach((chave) => {
      const disciplina = DISCIPLINAS[chave];
      const qtdAulas = disciplina.aulas.length;
      const cor = disciplina.cor || "#2f6fb0";

      const card = document.createElement("a");
      card.className = "card";
      card.href = `disciplina.html?curso=${chave}`;
      card.style.setProperty("--card-color", cor);

      card.innerHTML = `
        <span class="icon-badge">${disciplina.icone || "📘"}</span>
        <span class="sigla mono-tag">${disciplina.sigla}</span>
        <h2>${disciplina.nome}</h2>
        ${disciplina.descricao ? `<p class="descricao">${disciplina.descricao}</p>` : ""}
        <p class="meta mono-tag">${String(qtdAulas).padStart(2, "0")} ${qtdAulas === 1 ? "AULA DISPONÍVEL" : "AULAS DISPONÍVEIS"}</p>
        <span class="cta">Ver aulas →</span>
      `;

      container.appendChild(card);
    });
  </script>
</body>
</html>
